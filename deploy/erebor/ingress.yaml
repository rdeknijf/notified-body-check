# Public front door on erebor. DNS-01 through Cloudflare, so the certificate is
# issued before DNS points here. Until the DNS switch, this Ingress answers only
# a request that forces the erebor address (curl --resolve).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nbcheck
  namespace: nbcheck
  labels:
    app: nbcheck
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-dns01
    # 10 requests per second with a burst of 40 per client, keyed on the
    # CF-Connecting-IP header. The controller sees only the load balancer address,
    # so the built-in limit-rps annotation would put all clients in one bucket.
    # Zone `nbcheck` comes from http-snippet in square's
    # clusters/erebor/ingress-nginx/configmap.yaml.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req zone=nbcheck burst=40 nodelay;
      limit_req_status 429;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nbcheck.deknijf.com
      secretName: nbcheck-tls
  rules:
    - host: nbcheck.deknijf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nbcheck
                port:
                  number: 8000
