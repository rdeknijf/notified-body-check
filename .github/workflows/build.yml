name: build

# Builds an immutable image tagged with the commit SHA and pushes it to GHCR.
# Deploying is a separate step: deploy/erebor pins this SHA and Flux applies it.
# A pull request builds without pushing, which proves the Dockerfile still works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The fonts under src/ are in Git LFS. Without lfs the image gets pointer files.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push outside pull requests (tag = commit SHA)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/rdeknijf/notified-body-check:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
